server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        mvc:
          routes:
            - id: device-service
              uri: ${DEVICE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/devices/**
            - id: telemetry-service
              uri: ${TELEMETRY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/telemetry/**
            - id: alert-service
              uri: ${ALERT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/alerts/**,/api/geofences/**
            - id: ws-gateway
              uri: ${WS_GATEWAY_URL:http://localhost:8085}
              predicates:
                - Path=/ws/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
