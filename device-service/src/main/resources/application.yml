server:
  port: 8081

spring:
  application:
    name: device-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fleet}
    username: ${DB_USER:fleet}
    password: ${DB_PASSWORD:fleet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: device-service
      auto-offset-reset: earliest

geopulse:
  security:
    issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/fleet}
    jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/fleet/protocol/openid-connect/certs}
    audience: fleet-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
