name: geopulse

services:
  mysql:
    image: mysql:8.4
    container_name: geopulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fleet
      MYSQL_DATABASE: fleet
      MYSQL_USER: fleet
      MYSQL_PASSWORD: fleet
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufleet", "-pfleet"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: geopulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    container_name: geopulse-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: geopulse-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: geopulse-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  device-service:
    build:
      context: .
      args: { MODULE: device-service }
    container_name: geopulse-device-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fleet
      DB_USER: fleet
      DB_PASSWORD: fleet
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
      KEYCLOAK_ISSUER: http://localhost:8180/realms/fleet
      KEYCLOAK_JWKS: http://keycloak:8080/realms/fleet/protocol/openid-connect/certs
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  ingestion-service:
    build:
      context: .
      args: { MODULE: ingestion-service }
    container_name: geopulse-ingestion-service
    ports:
      - "8082:8082"
    environment:
      MQTT_BROKER_URL: tcp://mosquitto:1883
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      mosquitto: { condition: service_started }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  telemetry-service:
    build:
      context: .
      args: { MODULE: telemetry-service }
    container_name: geopulse-telemetry-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fleet
      DB_USER: fleet
      DB_PASSWORD: fleet
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
      KEYCLOAK_ISSUER: http://localhost:8180/realms/fleet
      KEYCLOAK_JWKS: http://keycloak:8080/realms/fleet/protocol/openid-connect/certs
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  alert-service:
    build:
      context: .
      args: { MODULE: alert-service }
    container_name: geopulse-alert-service
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fleet
      DB_USER: fleet
      DB_PASSWORD: fleet
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
      KEYCLOAK_ISSUER: http://localhost:8180/realms/fleet
      KEYCLOAK_JWKS: http://keycloak:8080/realms/fleet/protocol/openid-connect/certs
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  ws-gateway:
    build:
      context: .
      args: { MODULE: ws-gateway }
    container_name: geopulse-ws-gateway
    ports:
      - "8085:8085"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KEYCLOAK_ISSUER: http://localhost:8180/realms/fleet
      KEYCLOAK_JWKS: http://keycloak:8080/realms/fleet/protocol/openid-connect/certs
    depends_on:
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  api-gateway:
    build:
      context: .
      args: { MODULE: api-gateway }
    container_name: geopulse-api-gateway
    ports:
      - "8080:8080"
    environment:
      DEVICE_SERVICE_URL: http://device-service:8081
      TELEMETRY_SERVICE_URL: http://telemetry-service:8083
      ALERT_SERVICE_URL: http://alert-service:8084
      WS_GATEWAY_URL: http://ws-gateway:8085
    depends_on:
      - device-service
      - telemetry-service
      - alert-service
      - ws-gateway

volumes:
  mysql_data:
  redis_data:
  mosquitto_data:
