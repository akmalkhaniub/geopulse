server:
  port: 8082

spring:
  application:
    name: ingestion-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

geopulse:
  mqtt:
    broker-url: ${MQTT_BROKER:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:ingestion-service}
    enabled: ${MQTT_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
