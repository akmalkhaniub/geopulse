server:
  port: 8085

spring:
  application:
    name: ws-gateway
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ws-gateway
      auto-offset-reset: latest
    producer:
      acks: all

geopulse:
  security:
    issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/fleet}
    jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/fleet/protocol/openid-connect/certs}
    audience: fleet-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
